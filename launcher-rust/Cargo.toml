[package]
name = "life-clicker-launcher"
version = "3.0.0"
edition = "2024"
rust-version = "1.98"

[[bin]]
name = "LifeClicker"
path = "src/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

