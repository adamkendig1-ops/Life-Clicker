name: Build Final Auto-Updating Windows Install

on:
  push:
    paths:
      - ".github/workflows/build-final-manual.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Assemble and validate full install
        env:
          LAUNCHER_HTML_B64: 
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, os, re, shutil, subprocess, zipfile
          root=Path("dist/Life_Clicker_7.0.6_Final_Auto_Updating_Windows")
          if root.exists(): shutil.rmtree(root)
          (root/"game").mkdir(parents=True)
          (root/"userdata"/"backups").mkdir(parents=True)
          (root/"userdata"/"game-backups").mkdir(parents=True)
          pkg_path=Path("stable/Life_Clicker_Update_7.0.6_Business_Career_Repair.lcupdate")
          pkg=json.loads(pkg_path.read_text(encoding="utf-8"))
          assert pkg["version"]=="7.0.6" and pkg["saveVersion"]==12
          html=pkg["appHtml"]
          assert "const VERSION='7.0.6',SAVE_VERSION=12" in html
          required=["Owner Investment","businessInvestAmount","Blocked because:","Career offer blocked:","Accept Offer"]
          for s in required: assert s in html, s
          (root/"game"/"index.html").write_text(html,encoding="utf-8")
          (root/"game"/"version.json").write_text(json.dumps({"version":"7.0.6","saveVersion":12,"launcherVersion":"2.1.1","product":"Life Clicker"},indent=2)+"\n",encoding="utf-8")
          launcher=Path("stable/LifeClicker_2.1.1.exe")
          data=launcher.read_bytes()
          assert data[:2]==b"MZ" and len(data)>1_000_000
          shutil.copy2(launcher,root/"LifeClicker.exe")
          (root/"launcher.html").write_bytes(base64.b64decode(os.environ["LAUNCHER_HTML_B64"]))
          cfg={"channel":"stable","manifestUrl":"https://raw.githubusercontent.com/adamkendig1-ops/Life-Clicker/main/stable/latest.json"}
          (root/"launcher-config.json").write_text(json.dumps(cfg,indent=2)+"\n",encoding="utf-8")
          (root/"START_LIFE_CLICKER.bat").write_text("@echo off\r\ncd /d %~dp0\r\nstart \"\" LifeClicker.exe\r\n",encoding="utf-8")
          (root/"userdata"/"backups"/"README.txt").write_text("Automatic save snapshots are stored here when created by the launcher.\n",encoding="utf-8")
          (root/"userdata"/"game-backups"/"README.txt").write_text("Pre-update game-code backups are stored here by the launcher.\n",encoding="utf-8")
          readme="""LIFE CLICKER 7.0.6 — FINAL MANUAL REPLACEMENT
================================================

This is intended to be the LAST normal manual program replacement.

Included:
- Life Clicker 7.0.6
- Save Version 12
- Launcher 2.1.1
- permanent stable online-update feed
- cache-busted online update checks
- automatic size + SHA-256 verification
- save snapshot + game-code backup before online updates
- business upgrade blocker explanations
- exact-dollar Owner Investment
- repaired Career offer acceptance

ONE-TIME INSTALL
----------------
1. Completely close every old Life Clicker window.
2. Extract this entire folder.
3. Keep the old folder as a backup for now; do not delete it yet.
4. Run LifeClicker.exe from THIS new folder.
5. Confirm the launcher says Game 7.0.6 and Launcher 2.1.1.
6. Click Check Online Updates.

Your browser save origin remains http://127.0.0.1:8765, so using the same browser/profile
preserves browser-local profiles. Do not run an old and new LifeClicker.exe at the same time.

FUTURE UPDATES
--------------
After this build, use the in-app online updater. Normal future releases should not
require replacing the program folder manually.
"""
          (root/"README_FIRST.txt").write_text(readme,encoding="utf-8")
          scripts=re.findall(r"<script[^>]*>([\s\S]*?)</script>",html,re.I)
          assert scripts
          check=Path("dist/game_check.js")
          check.write_text("\n".join(scripts),encoding="utf-8")
          subprocess.run(["node","--check",str(check)],check=True)
          hashes=[]
          for p in sorted(root.rglob("*")):
              if p.is_file():
                  hashes.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}")
          (root/"RELEASE_SHA256.txt").write_text("\n".join(hashes)+"\n",encoding="utf-8")
          report=[
            "Life Clicker 7.0.6 Final Auto-Updating Windows Build",
            "Game version: 7.0.6",
            "Save version: 12",
            "Launcher version: 2.1.1",
            "Game JS syntax: PASS",
            "Launcher PE signature: PASS",
            "Live update feed configured: PASS",
            "Business feature markers: PASS",
            "Career offer repair markers: PASS",
          ]
          (root/"VALIDATION.txt").write_text("\n".join(report)+"\n",encoding="utf-8")
          zip_path=Path("dist/Life_Clicker_7.0.6_Final_Auto_Updating_Windows.zip")
          with zipfile.ZipFile(zip_path,"w",zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob("*")):
                  if p.is_file(): z.write(p,p.relative_to(root.parent))
          with zipfile.ZipFile(zip_path) as z:
              assert z.testzip() is None
          (Path("dist")/"FINAL_ZIP_SHA256.txt").write_text(hashlib.sha256(zip_path.read_bytes()).hexdigest()+"  "+zip_path.name+"\n",encoding="utf-8")
          print("\n".join(report))
          print("ZIP",zip_path,zip_path.stat().st_size)
          print("ZIP SHA256",hashlib.sha256(zip_path.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Life_Clicker_7.0.6_Final_Auto_Updating_Windows
          path: |
            dist/Life_Clicker_7.0.6_Final_Auto_Updating_Windows.zip
            dist/FINAL_ZIP_SHA256.txt
          if-no-files-found: error
          retention-days: 30
